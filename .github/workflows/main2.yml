name: Verify Human Identity
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ubuntu-latest
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npx clawhub@latest install verified-agent-identity
          cd scripts
          npm install
name   - name: Create Identity & Generate Link
        run: |
          node scripts/createNewEthereumIdentity.js
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "Godwin inle", "description": "Premium phone npendencies
